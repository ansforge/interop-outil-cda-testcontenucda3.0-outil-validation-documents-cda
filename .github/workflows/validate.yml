name: validate

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      branchIgDocumentCore:
        description: 'Branch IG-document-core'     
        required: true
        default: 'main'



# The following jobs are equal for all IGs and can be moved to a common composite-action if 'uses'-support is added, see:
# https://github.com/actions/runner/blob/main/docs/adrs/1144-composite-actions.md
jobs:
  publish:
    runs-on: windows-latest
    #runs-on: ubuntu-latest
    steps:
      - name: Get soft to validate
        uses: actions/checkout@main
        with:
          persist-credentials: false
          repository: M-Priour/validateCDA
          path: validateCDA

      - name: Configure Git
        run: git config --system core.longpaths true



      # Get REPO

      
      - name: get REPO
        uses: actions/checkout@v3
        with:      
          path: testContenuCDA

      - name: Install wget for Windows
        run: choco install wget --no-progress
      
      - name: Validation FHIR
        run: |
           cd validateCDA
           wget -q https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar
           mkdir package
           cd .\package
           echo "https://github.com/ansforge/IG-document-core/raw/refs/heads/gh-pages/${{ github.event.inputs.branchIgDocumentCore }}/ig/package.tgz"
           wget -q "https://github.com/ansforge/IG-document-core/raw/refs/heads/gh-pages/${{ github.event.inputs.branchIgDocumentCore }}/ig/package.tgz"
           cd ..
           del ../testContenuCDA/ExemplesCDA/01_Mod*.xml
           java  "-Dfile.encoding=UTF-8"  -jar validator_cli.jar D:/a/interop-outil-cda-testcontenucda3.0-outil-validation-documents-cda/interop-outil-cda-testcontenucda3.0-outil-validation-documents-cda/testContenuCDA/ExemplesCDA/  -ig .\package -profile https://interop.esante.gouv.fr/ig/document/core/StructureDefinition/fr-cda-clinical-document -output .\validation.xml  -language fr-FR  -verbose  -locale fr-FR 
          # python insert_validation_results.py --xml validation.xml --html D:/a/TestContenuCDA-3-0/TestContenuCDA-3-0/report/index.html           
      

      
      - uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: '17'    
      - name: Validate        
        run: |
          cd validateCDA
          mkdir D:/a/TestContenuCDA-3-0/TestContenuCDA-3-0/report/
          java -Xms2g -Xmx4g -cp ./librairie/* ./validate.java -i ../testContenuCDA/ExemplesCDA/ -o D:/a/TestContenuCDA-3-0/TestContenuCDA-3-0/report 
          python insert_validation_results.py --xml validation.xml --html D:/a/TestContenuCDA-3-0/TestContenuCDA-3-0/report/index.html           
      



      - name: Get branch names
        id: branch-name
        uses: tj-actions/branch-names@v7.0.7
        
        
      # Publishes the HTML page to a seperate branch in order to host it using GitHub-Pages.
      # This will overwrite the currently published HTML page.
      - name: 🚀 Deploy to GitHub-Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  D:/a/TestContenuCDA-3-0/TestContenuCDA-3-0/report 
          destination_dir: rapport/${{ steps.branch-name.outputs.current_branch }}
          commit_message: ' ${{ github.event.head_commit.message }}'
